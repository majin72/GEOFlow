server {
    listen 80;
    server_name _;

    # 默认 1m 会导致后台多图/大图上传 413；需不小于 PHP post_max_size，并覆盖单次 multipart 总体积
    client_max_body_size 64m;

    root /var/www/html/public;
    index index.php;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|avif|ttf|otf|woff|woff2)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Reverb WebSocket（Pusher 协议）：浏览器从 80 端口走反代到内部 reverb:18080，避免单独暴露端口
    # 严格匹配 /app/{appKey}（建立 WS）和 /apps/{appId}/...（HTTP 推送回执），不会与业务路由冲突
    # 注意：upstream 端口写死 18080；如修改 .env.prod 的 REVERB_SERVER_PORT 与 docker-compose 中 reverb 容器内监听端口，需同步改此处
    location ~ ^/(app|apps)/ {
        proxy_pass http://reverb:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 300;
        internal;
    }
}
