name: geoflow-laravel

# GEO 监测 sidecar 可选：docker compose --profile geo-monitor up -d（见 docs/geo-monitoring-docker.md）

# Vite 与 PHP 镜像构建参数；任一 build 块使用 `args: *app_build_args` 即可复用。
x-app-build-args: &app_build_args
  VITE_REVERB_APP_KEY: "${REVERB_APP_KEY:-}"
  VITE_REVERB_HOST: "${REVERB_HOST:-}"
  VITE_REVERB_PORT: "${REVERB_PORT:-}"
  VITE_REVERB_SCHEME: "${REVERB_SCHEME:-}"
  VITE_REVERB_PATH: "${REVERB_SERVER_PATH:-}"
  PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-php:8.4-cli-bookworm}

# GEO 监测 sidecar 与 Laravel 共用 storage 证据目录
x-geo-monitor-storage-volume: &geo_monitor_storage_volume ./storage:/var/www/html/storage

# GEO 监测 sidecar（Chromium + noVNC）。仅在使用 --profile geo-monitor 时启动。
x-geo-monitor-sidecar: &geo_monitor_sidecar
  profiles:
    - geo-monitor
  image: geoflow/geo-monitor-sidecar:latest
  build:
    context: ./tools/geo-monitor-poc
    dockerfile: docker/Dockerfile.sidecar-novnc
    args:
      PIP_INDEX_URL: ${GEO_MONITOR_PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
      PIP_TRUSTED_HOST: ${GEO_MONITOR_PIP_TRUSTED_HOST:-mirrors.aliyun.com}
  environment:
    DISPLAY: ":99"
    GEO_MONITOR_DISPLAY: ":99"
    # 容器内须 0.0.0.0，否则 Docker 端口映射无法转发；公网暴露由下方 127.0.0.1:6080 限制。
    GEO_MONITOR_NOVNC_BIND: "0.0.0.0"
    GEO_MONITOR_NOVNC_PORT: "${GEOFLOW_GEO_MONITOR_NOVNC_PORT:-6080}"
    GEO_MONITOR_PROFILE_ROOT: "/app/profiles"
    GEO_MONITOR_EVIDENCE_ROOT: "/var/www/html/storage/app/geo-monitor/evidence"
    GEO_MONITOR_APP_UID: "33"
    GEO_MONITOR_APP_GID: "33"
    GEO_MONITOR_ACCOUNTS_FILE: "/app/accounts.json"
    GEO_MONITOR_SIDECAR_TOKEN: "${GEOFLOW_GEO_MONITOR_SIDECAR_TOKEN:-}"
    GEO_MONITOR_SIDECAR_HOST: "0.0.0.0"
    GEO_MONITOR_SIDECAR_PORT: "${GEOFLOW_GEO_MONITOR_SIDECAR_PORT:-8765}"
  ports:
    - "127.0.0.1:${GEOFLOW_GEO_MONITOR_NOVNC_PORT:-6080}:6080"
    - "127.0.0.1:${GEOFLOW_GEO_MONITOR_SIDECAR_PORT:-8765}:8765"
  volumes:
    - ./tools/geo-monitor-poc:/app
    - *geo_monitor_storage_volume
    - geo-monitor-novnc-state:/app/.novnc-state
  shm_size: "1gb"
  restart: unless-stopped

services:
  postgres:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg16}
    container_name: geoflow-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-geo_flow}
      POSTGRES_USER: ${DB_USERNAME:-geo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geo_password}
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-15432}:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-./docker-data/dev/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-geo_user} -d ${DB_DATABASE:-geo_flow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: geoflow-redis
    ports:
      - "127.0.0.1:${REDIS_EXPOSE_PORT:-16379}:6379"
    restart: unless-stopped

  init:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: *app_build_args
    container_name: geoflow-init
    working_dir: /var/www/html
    env_file:
      - ./.env
    # 交给 entrypoint 执行自动初始化（生成 APP_KEY / migrate / seed）
    command: ["php", "artisan", "about"]
    environment:
      AUTO_GENERATE_APP_KEY: "true"
      AUTO_INIT_ONCE: "true"
      AUTO_MIGRATE: "true"
    volumes:
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: "no"

  app:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: *app_build_args
    container_name: geoflow-app
    working_dir: /var/www/html
    env_file:
      - ./.env
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${APP_PORT:-18080}:8080"
    volumes:
      - ./:/var/www/html
    # 让容器能解析 host.docker.internal → 宿主机网关 IP，
    # 用于访问宿主机上 external-fetch-bridge (127.0.0.1:19826)，或服务器侧 autossh 穿出来的隧道。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  queue:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: *app_build_args
    container_name: geoflow-queue
    working_dir: /var/www/html
    env_file:
      - ./.env
    command: ["php", "artisan", "queue:work", "redis", "--queue=geoflow,distribution,default", "--sleep=1", "--tries=1", "--timeout=300"]
    volumes:
      - ./:/var/www/html
    # URL 智能采集 job 在此容器执行；走 host.docker.internal 访问宿主机上的 external-fetch-bridge。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: *app_build_args
    container_name: geoflow-scheduler
    working_dir: /var/www/html
    env_file:
      - ./.env
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/html
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  reverb:
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: *app_build_args
    container_name: geoflow-reverb
    working_dir: /var/www/html
    env_file:
      - ./.env
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_EXPOSE_PORT:-18081}:8080"
    volumes:
      - ./:/var/www/html
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  geo-monitor-sidecar:
    <<: *geo_monitor_sidecar
    container_name: geoflow-geo-monitor-sidecar

volumes:
  geo-monitor-novnc-state:
