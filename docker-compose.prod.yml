# postgres 凭据由 DB_* 插值映射为官方镜像的 POSTGRES_*；redis 使用 REDIS_PASSWORD。推荐 docker compose --env-file .env.prod …
name: geoflow-laravel-prod

# Vite 构建期注入的前端公开变量；任一 build 块使用 `args: *vite_build_args` 即可复用。
# 这些值会被 Vite 直接打入 JS 产物，因此即使更换 .env.prod 也需要重新 build 镜像才能生效。
x-vite-build-args: &vite_build_args
  VITE_REVERB_APP_KEY: "${REVERB_APP_KEY:-}"
  VITE_REVERB_HOST: "${REVERB_HOST:-}"
  VITE_REVERB_PORT: "${REVERB_PORT:-}"
  VITE_REVERB_SCHEME: "${REVERB_SCHEME:-}"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: geoflow-postgres-prod
    environment:
      POSTGRES_DB: "${DB_DATABASE:-geo_flow}"
      POSTGRES_USER: "${DB_USERNAME:-geo_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-change-this-password}"
    volumes:
      - ${POSTGRES_DATA_DIR:-./docker-data/prod/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: geoflow-redis-prod
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    command:
      - /bin/sh
      - -lc
      - |
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
        fi
        exec redis-server --appendonly yes
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD:-}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  init:
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      args: *vite_build_args
    container_name: geoflow-init-prod
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    command: ["php", "artisan", "about"]
    environment:
      AUTO_MIGRATE: "true"
      AUTO_SEED: "true"
      AUTO_OPTIMIZE: "false"
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  app:
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      args: *vite_build_args
    container_name: geoflow-app-prod
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    # 让容器能解析 host.docker.internal → 宿主机网关 IP（host-gateway=docker0 上的 172.17.0.1）。
    # 用于访问宿主机上 autossh 反向隧道穿出来的 external-fetch-bridge (127.0.0.1:19826)。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 同时接入 default（compose 自定义网络，与 postgres/redis 通信）
    # 与 host_access（docker 默认 bridge 网络，172.17.0.0/16）：
    # 这样容器访问 172.17.0.1 是同 bridge 内流量，绕过 docker DOCKER-ISOLATION 隔离规则。
    networks:
      - default
      - host_access
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    image: geoflow-web-prod:latest
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
      args: *vite_build_args
    container_name: geoflow-web-prod
    ports:
      - "${WEB_PORT:-18080}:80"
    volumes:
      - ./storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  queue:
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      args: *vite_build_args
    container_name: geoflow-queue-prod
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    command: ["php", "artisan", "queue:work", "redis", "--queue=geoflow,default", "--sleep=1", "--tries=1", "--timeout=300"]
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    # URL 智能采集 job 在此容器执行；走 host.docker.internal 访问宿主机上的 external-fetch-bridge。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 见 app 服务的说明：同时接入 default + host_access，避免跨 bridge isolation 阻挡。
    networks:
      - default
      - host_access
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      args: *vite_build_args
    container_name: geoflow-scheduler-prod
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  reverb:
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      args: *vite_build_args
    container_name: geoflow-reverb-prod
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    # 端口不在此处硬编码：由 .env.prod 的 REVERB_SERVER_PORT 决定（见 config/reverb.php），nginx 反代也需对齐该端口
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0"]
    ports:
      - "${REVERB_EXPOSE_PORT:-18081}:${REVERB_SERVER_PORT:-18080}"
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

# Docker 默认 bridge 网络（external，docker daemon 启动时自动创建，无需任何额外配置）。
# 仅给 app / queue 接入，用于跨 bridge 访问 docker0 上的反向隧道目标 (172.17.0.1:19826)，
# 同时绕过 docker iptables 跨自定义 bridge 的 DOCKER-ISOLATION 阻挡。
# 该网络默认无 DNS service discovery，但本项目仅用它做单向 IP 直连，不依赖名字解析。
networks:
  host_access:
    name: bridge
    external: true
