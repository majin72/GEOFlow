# postgres 凭据由 DB_* 插值映射为官方镜像的 POSTGRES_*；redis 使用 REDIS_PASSWORD。推荐 docker compose --env-file .env.prod …
# GEO 监测 sidecar 可选：--profile geo-monitor（见 docs/geo-monitoring-docker.md）
# Linux 宿主机：挂载的 ./storage 须对容器内 PHP-FPM 用户可写（官方 php:fpm 常见为 www-data UID/GID 33）；勿长期 root:root 755，否则上传/日志/会话会失败。
name: geoflow-laravel-prod

# Vite 与生产镜像构建参数；build 块使用对应 anchor 复用。
x-prod-app-build-args: &prod_app_build_args
  VITE_REVERB_APP_KEY: "${REVERB_APP_KEY:-}"
  VITE_REVERB_HOST: "${REVERB_HOST:-}"
  VITE_REVERB_PORT: "${REVERB_PORT:-}"
  VITE_REVERB_SCHEME: "${REVERB_SCHEME:-}"
  VITE_REVERB_PATH: "${REVERB_SERVER_PATH:-}"
  PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-php:8.4-cli-bookworm}
  PHP_FPM_IMAGE: ${PHP_FPM_IMAGE:-php:8.4-fpm-bookworm}

x-prod-web-build-args: &prod_web_build_args
  VITE_REVERB_APP_KEY: "${REVERB_APP_KEY:-}"
  VITE_REVERB_HOST: "${REVERB_HOST:-}"
  VITE_REVERB_PORT: "${REVERB_PORT:-}"
  VITE_REVERB_SCHEME: "${REVERB_SCHEME:-}"
  VITE_REVERB_PATH: "${REVERB_SERVER_PATH:-}"

# 生产 `app` / `queue` 已挂载 `./tools/geo-monitor-poc`，与 sidecar 共享 `accounts.json`、`profiles/`。
# 探测证据写入 `./storage/app/geo-monitor/evidence`（app 与 sidecar 均挂载 `./storage`）。
x-geo-monitor-storage-volume: &geo_monitor_storage_volume ./storage:/var/www/html/storage

# GEO 监测 sidecar（Chromium + noVNC）。仅在使用 --profile geo-monitor 时启动。
x-geo-monitor-sidecar: &geo_monitor_sidecar
  profiles:
    - geo-monitor
  image: geoflow/geo-monitor-sidecar:latest
  build:
    context: ./tools/geo-monitor-poc
    dockerfile: docker/Dockerfile.sidecar-novnc
    args:
      PIP_INDEX_URL: ${GEO_MONITOR_PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
      PIP_TRUSTED_HOST: ${GEO_MONITOR_PIP_TRUSTED_HOST:-mirrors.aliyun.com}
  environment:
    DISPLAY: ":99"
    GEO_MONITOR_DISPLAY: ":99"
    GEO_MONITOR_NOVNC_BIND: "0.0.0.0"
    GEO_MONITOR_NOVNC_PORT: "${GEOFLOW_GEO_MONITOR_NOVNC_PORT:-6080}"
    GEO_MONITOR_PROFILE_ROOT: "/app/profiles"
    GEO_MONITOR_EVIDENCE_ROOT: "/var/www/html/storage/app/geo-monitor/evidence"
    GEO_MONITOR_APP_UID: "33"
    GEO_MONITOR_APP_GID: "33"
    GEO_MONITOR_ACCOUNTS_FILE: "/app/accounts.json"
    GEO_MONITOR_SIDECAR_TOKEN: "${GEOFLOW_GEO_MONITOR_SIDECAR_TOKEN:-}"
    GEO_MONITOR_SIDECAR_HOST: "0.0.0.0"
    GEO_MONITOR_SIDECAR_PORT: "${GEOFLOW_GEO_MONITOR_SIDECAR_PORT:-8765}"
  ports:
    - "127.0.0.1:${GEOFLOW_GEO_MONITOR_NOVNC_PORT:-6080}:6080"
    - "127.0.0.1:${GEOFLOW_GEO_MONITOR_SIDECAR_PORT:-8765}:8765"
  volumes:
    - ./tools/geo-monitor-poc:/app
    - *geo_monitor_storage_volume
    - geo-monitor-novnc-state:/app/.novnc-state
  shm_size: "1gb"
  restart: unless-stopped

# 生产 `app` / `queue` 已挂载 `./tools/geo-monitor-poc`，与 sidecar 共享 accounts.json、profiles。
x-geo-monitor-app-volume: &geo_monitor_app_volume ./tools/geo-monitor-poc:/var/www/html/tools/geo-monitor-poc

services:
  postgres:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg16}
    container_name: geoflow-postgres-prod
    environment:
      POSTGRES_DB: "${DB_DATABASE:-geo_flow}"
      POSTGRES_USER: "${DB_USERNAME:-geo_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-change-this-password}"
    volumes:
      - ${POSTGRES_DATA_DIR:-./docker-data/prod/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: geoflow-redis-prod
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    command:
      - /bin/sh
      - -lc
      - |
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
        fi
        exec redis-server --appendonly yes
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD:-}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  init:
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      args: *prod_app_build_args
    container_name: geoflow-init-prod
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    command: ["php", "artisan", "about"]
    environment:
      AUTO_MIGRATE: "true"
      AUTO_SEED: "true"
      AUTO_OPTIMIZE: "false"
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  app:
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      args: *prod_app_build_args
    container_name: geoflow-app-prod
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
      - *geo_monitor_app_volume
    # Docker Desktop（mac/win）下 host.docker.internal 自带；Linux 部署若需访问宿主机服务，
    # 推荐在 admin 后台直接填 compose 自定义网络的实际 gateway IP，不在 compose 里硬编码。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    image: geoflow-web-prod:latest
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
      args: *prod_web_build_args
    container_name: geoflow-web-prod
    ports:
      - "${WEB_PORT:-18080}:80"
    volumes:
      - ./storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  queue:
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      args: *prod_app_build_args
    container_name: geoflow-queue-prod
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    command: ["php", "artisan", "queue:work", "redis", "--queue=geoflow,distribution,default", "--sleep=1", "--tries=1", "--timeout=300"]
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
      - *geo_monitor_app_volume
    # URL 智能采集 job 在此容器执行。Linux 服务器经反向 SSH 隧道访问宿主机/远端 bridge 时，
    # 推荐在 admin 后台填写 compose 自定义网络的实际 gateway IP（每次 docker compose up 后查询）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      args: *prod_app_build_args
    container_name: geoflow-scheduler-prod
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  reverb:
    image: geoflow-app-prod:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      args: *prod_app_build_args
    container_name: geoflow-reverb-prod
    working_dir: /var/www/html
    env_file:
      - ./.env.prod
    # 端口不在此处硬编码：由 .env.prod 的 REVERB_SERVER_PORT 决定（见 config/reverb.php），nginx 反代也需对齐该端口
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0"]
    ports:
      - "${REVERB_EXPOSE_PORT:-18081}:${REVERB_SERVER_PORT:-18080}"
    volumes:
      - ./.env.prod:/var/www/html/.env
      - ./storage:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  geo-monitor-sidecar:
    <<: *geo_monitor_sidecar
    container_name: geoflow-geo-monitor-sidecar-prod

volumes:
  geo-monitor-novnc-state:
